<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sombra suave para os cards -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="sidebar-shadow" x="0" y="0" width="120%" height="100%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="0" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #F4F6F9; }
    .sidebar { fill: #071746; }
    .sidebar-accent { fill: #0B2265; }
    .card { fill: #FFFFFF; rx: 14px; ry: 14px; filter: url(#card-shadow); }
    .brand-yellow { fill: #FFCC00; }
    .brand-blue { fill: #0B2265; }
    .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #0B2265; }
    .text-muted { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; fill: #718096; }
    .text-sidebar { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; fill: #CBD5E1; }
    .text-sidebar-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; fill: #FFFFFF; letter-spacing: 1.5px; }
  </style>

  <!-- 1. Fundo Geral (Canvas Off-White) -->
  <rect class="bg" width="1920" height="1080"/>

  <!-- 2. Barra Lateral (Sidebar) com Sombra -->
  <rect class="sidebar" x="0" y="0" width="340" height="1080" filter="url(#sidebar-shadow)"/>

  <!-- Logo Estilizado Blockbuster -->
  <g transform="translate(45, 45)">
    <!-- Fita / Ticket Box Amarelo -->
    <rect x="0" y="0" width="250" height="75" rx="8" fill="#FFCC00"/>
    <text x="125" y="44" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" fill="#071746" letter-spacing="1px" transform="rotate(-2, 125, 44)">BLOCKBUSTER</text>
    <text x="125" y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#071746" letter-spacing="4px">VIDEO BI PORTAL</text>
  </g>

  <!-- Divisor e Seções da Sidebar -->
  <line x1="35" y1="160" x2="305" y2="160" stroke="#1E293B" stroke-width="1.5"/>

  <text class="text-sidebar-title" x="45" y="200" font-size="13">FILTROS OPERACIONAIS</text>

  <!-- Molduras para os Segmentadores (Slicers) da Sidebar -->
  <!-- Filtro 1: Período / Ano -->
  <rect x="35" y="225" width="270" height="65" rx="8" class="sidebar-accent"/>
  <text class="text-sidebar" x="50" y="250" font-size="12">PERÍODO / ANO</text>

  <!-- Filtro 2: Categoria -->
  <rect x="35" y="310" width="270" height="65" rx="8" class="sidebar-accent"/>
  <text class="text-sidebar" x="50" y="335" font-size="12">GÊNERO / CATEGORIA</text>

  <!-- Filtro 3: País / Região -->
  <rect x="35" y="395" width="270" height="65" rx="8" class="sidebar-accent"/>
  <text class="text-sidebar" x="50" y="420" font-size="12">PAÍS / MERCADO</text>

  <!-- Filtro 4: Classificação Indicativa -->
  <rect x="35" y="480" width="270" height="65" rx="8" class="sidebar-accent"/>
  <text class="text-sidebar" x="50" y="505" font-size="12">CLASSIFICAÇÃO (RATING)</text>

  <!-- Rodapé da Sidebar -->
  <g transform="translate(45, 1000)">
    <circle cx="15" cy="15" r="10" fill="#FFCC00"/>
    <text x="35" y="20" class="text-sidebar" font-size="13">Database: PostgreSQL 3NF</text>
  </g>

  <!-- 3. Header da Área Principal -->
  <text class="text-title" x="380" y="70" font-size="28">Visão Executiva de Locações &amp; Performance</text>
  <text class="text-muted" x="380" y="96" font-size="14">Monitoramento analítico de faturamento, giro de inventário e eficiência de devolução</text>

  <!-- 4. Quatro Cards de Métricas Superiores (KPIs) -->
  <!-- Card 1: Receita Total -->
  <g transform="translate(380, 125)">
    <rect class="card" width="350" height="120"/>
    <rect class="brand-yellow" x="0" y="0" width="8" height="120" rx="4"/>
    <text class="text-muted" x="30" y="40" font-size="13">RECEITA BRUTA TOTAL</text>
  </g>

  <!-- Card 2: Total Aluguéis -->
  <g transform="translate(760, 125)">
    <rect class="card" width="350" height="120"/>
    <rect class="brand-blue" x="0" y="0" width="8" height="120" rx="4"/>
    <text class="text-muted" x="30" y="40" font-size="13">TOTAL DE LOCAÇÕES</text>
  </g>

  <!-- Card 3: Ticket Médio -->
  <g transform="translate(1140, 125)">
    <rect class="card" width="350" height="120"/>
    <rect class="brand-yellow" x="0" y="0" width="8" height="120" rx="4"/>
    <text class="text-muted" x="30" y="40" font-size="13">TICKET MÉDIO POR FILME</text>
  </g>

  <!-- Card 4: Total Atrasos -->
  <g transform="translate(1520, 125)">
    <rect class="card" width="350" height="120"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#E74C3C"/>
    <text class="text-muted" x="30" y="40" font-size="13">LOCAÇÕES COM ATRASO</text>
  </g>

  <!-- 5. Linha Central: Tendência Temporal e Top Filmes -->
  <!-- Card Gráfico de Linhas (Evolução Temporal) -->
  <g transform="translate(380, 275)">
    <rect class="card" width="910" height="375"/>
    <text class="text-title" x="30" y="45" font-size="17">Evolução Histórica da Receita</text>
    <text class="text-muted" x="30" y="68" font-size="12">Faturamento diário e ciclos sazonais de locação</text>
  </g>

  <!-- Card Gráfico de Barras Horizontais (Top 10 Títulos) -->
  <g transform="translate(1320, 275)">
    <rect class="card" width="550" height="375"/>
    <text class="text-title" x="30" y="45" font-size="17">Top 10 Títulos Mais Alugados</text>
    <text class="text-muted" x="30" y="68" font-size="12">Volume total de saídas do inventário</text>
  </g>

  <!-- 6. Linha Inferior: Eficiência Operacional e Faturamento por Categoria -->
  <!-- Card Gráfico Donut (Status de Devolução) -->
  <g transform="translate(380, 680)">
    <rect class="card" width="480" height="360"/>
    <text class="text-title" x="30" y="45" font-size="17">Eficiência Operacional (SLA)</text>
    <text class="text-muted" x="30" y="68" font-size="12">Proporção de devoluções no prazo vs. atraso</text>
  </g>

  <!-- Card Gráfico de Colunas (Receita por Gênero/Categoria) -->
  <g transform="translate(890, 680)">
    <rect class="card" width="980" height="360"/>
    <text class="text-title" x="30" y="45" font-size="17">Receita Consolidada por Categoria</text>
    <text class="text-muted" x="30" y="68" font-size="12">Performance financeira por gênero cinematográfico</text>
  </g>
</svg>
